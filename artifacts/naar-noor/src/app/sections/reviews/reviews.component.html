<section class="py-28 bg-[#0d0d0d] px-6 border-y border-white/5">
  <div class="max-w-7xl mx-auto">

    <div class="text-center mb-20">
      <span class="text-[#C65A1E] text-xs font-medium tracking-[0.2em] uppercase mb-3 block">Testimonials</span>
      <h2 class="font-['Forum'] text-4xl md:text-5xl text-white tracking-tight drop-shadow-[0_2px_8px_rgba(0,0,0,0.5)]">Guest Voices</h2>
      <div class="mt-6 w-12 h-px bg-[#C65A1E]/50 mx-auto"></div>
    </div>

    <div *ngIf="loading" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
      <div *ngFor="let i of [1,2,3]" class="p-8 rounded-2xl bg-[#111] border border-white/5 animate-pulse">
        <div class="flex gap-1 mb-6">
          <div *ngFor="let s of [1,2,3,4,5]" class="w-4 h-4 bg-white/10 rounded"></div>
        </div>
        <div class="space-y-2 mb-6">
          <div class="h-4 bg-white/5 rounded w-full"></div>
          <div class="h-4 bg-white/5 rounded w-4/5"></div>
        </div>
        <div class="h-3 bg-white/10 rounded w-20"></div>
      </div>
    </div>

    <div *ngIf="error" class="text-center py-16 text-neutral-500 text-sm">
      Unable to load reviews right now.
    </div>

    <div *ngIf="!loading && !error && reviews.length === 0" class="text-center py-16 text-neutral-500 text-sm">
      No reviews yet — be the first to dine with us!
    </div>

    <div *ngIf="!loading && !error && reviews.length > 0" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
      <article *ngFor="let review of reviews" class="p-8 rounded-2xl bg-[#111] border border-white/5 relative hover:border-white/10 transition-colors duration-300 flex flex-col">
        <iconify-icon icon="solar:quote-right-bold-duotone" width="48" class="absolute top-6 right-6 text-white/5" aria-hidden="true"></iconify-icon>

        <div class="flex items-center gap-1 mb-6 text-[#C65A1E]" [attr.aria-label]="review.rating + ' out of 5 stars'">
          <iconify-icon *ngFor="let s of [].constructor(review.rating)" icon="solar:star-bold" width="16" aria-hidden="true"></iconify-icon>
        </div>

        <p class="text-sm text-neutral-300 font-light italic leading-relaxed mb-8 flex-1">
          "{{ review.text }}"
        </p>

        <footer class="flex items-center justify-between">
          <span class="text-xs text-neutral-400 uppercase tracking-wider font-medium">{{ review.author }}</span>
          <span *ngIf="review.source" class="text-[10px] text-neutral-600 uppercase tracking-wider">{{ review.source }}</span>
        </footer>
      </article>
    </div>

  </div>
</section>
