<section id="blog" class="py-28 px-6">
  <div class="max-w-7xl mx-auto">
    <div class="text-center mb-20">
      <span class="text-[#C65A1E] text-xs font-medium tracking-[0.2em] uppercase mb-3 block">Journal</span>
      <h2 class="font-['Forum'] text-4xl md:text-5xl text-white tracking-tight drop-shadow-[0_2px_8px_rgba(0,0,0,0.5)]">Stories From The Fire</h2>
      <div class="mt-6 w-12 h-px bg-[#C65A1E]/50 mx-auto"></div>
    </div>

    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
      <article *ngFor="let post of posts">
        <a href="#" class="group block rounded-2xl bg-[#111] border border-white/5 overflow-hidden hover:border-white/10 transition-colors duration-300 h-full flex flex-col">
          <div class="aspect-[16/10] overflow-hidden shrink-0">
            <img
              [src]="post.image"
              [alt]="post.title"
              loading="lazy"
              class="w-full h-full object-cover opacity-75 group-hover:scale-105 group-hover:opacity-100 transition-all duration-700">
          </div>
          <div class="p-7 flex flex-col flex-1">
            <time class="text-xs text-neutral-500 mb-3 block">{{ post.date }}</time>
            <h3 class="font-['Forum'] text-xl text-white tracking-tight mb-3 group-hover:text-[#C65A1E] transition-colors duration-300 leading-snug">
              {{ post.title }}
            </h3>
            <p class="text-sm text-neutral-400 font-light mb-6 line-clamp-2 leading-relaxed flex-1">{{ post.excerpt }}</p>
            <span class="text-xs font-medium text-neutral-400 group-hover:text-[#C65A1E] transition-colors duration-300 flex items-center gap-1.5 uppercase tracking-wider mt-auto">
              Read More
              <iconify-icon icon="solar:arrow-right-linear" aria-hidden="true"></iconify-icon>
            </span>
          </div>
        </a>
      </article>
    </div>

    <div class="mt-14 text-center">
      <a href="#" class="inline-flex items-center gap-2 text-sm text-neutral-400 hover:text-white transition-colors duration-300">
        View All Posts
        <iconify-icon icon="solar:arrow-right-linear" aria-hidden="true"></iconify-icon>
      </a>
    </div>
  </div>
</section>
