<section class="py-24 px-6">
  <div class="max-w-7xl mx-auto">
    <div class="text-center mb-14">
      <span class="text-[#C65A1E] text-xs font-medium tracking-[0.2em] uppercase mb-3 block">Explore</span>
      <h2 class="font-['Forum'] text-4xl md:text-5xl text-white tracking-tight drop-shadow-[0_2px_8px_rgba(0,0,0,0.5)]">Our Cuisine</h2>
    </div>
    <div class="grid grid-cols-2 lg:grid-cols-4 gap-4 md:gap-6">
      <a 
        *ngFor="let category of categories" 
        href="#menu" 
        class="group relative aspect-square rounded-2xl overflow-hidden block">
        <img 
          [src]="category.image" 
          [alt]="category.title"
          loading="lazy"
          class="absolute inset-0 w-full h-full object-cover transition-transform duration-700 group-hover:scale-110 opacity-60 group-hover:opacity-80">
        <div class="absolute inset-0 bg-gradient-to-t from-[#0a0a0a]/90 via-[#0a0a0a]/30 to-transparent"></div>
        <div class="absolute inset-0 p-6 flex flex-col justify-end">
          <h3 class="font-['Forum'] text-xl md:text-2xl text-white tracking-tight group-hover:text-[#C65A1E] transition-colors duration-300">{{ category.title }}</h3>
        </div>
      </a>
    </div>
  </div>
</section>
