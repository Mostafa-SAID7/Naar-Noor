<section id="menu" class="py-28 px-6 bg-[#0d0d0d]">
  <div class="max-w-4xl mx-auto">
    <div class="text-center mb-20">
      <span class="text-[#C65A1E] text-xs font-medium tracking-[0.2em] uppercase mb-3 block">Signatures</span>
      <h2 class="font-['Forum'] text-4xl md:text-5xl text-white tracking-tight drop-shadow-[0_2px_8px_rgba(0,0,0,0.5)]">Crafted With Passion</h2>
      <div class="mt-6 w-12 h-px bg-[#C65A1E]/50 mx-auto"></div>
    </div>

    <div *ngIf="loading" class="space-y-12">
      <div *ngFor="let i of [1,2,3,4,5]" class="animate-pulse">
        <div class="flex items-baseline justify-between mb-2">
          <div class="h-5 bg-white/10 rounded w-48"></div>
          <div class="h-5 bg-white/10 rounded w-12"></div>
        </div>
        <div class="h-4 bg-white/5 rounded w-full"></div>
      </div>
    </div>

    <div *ngIf="error" class="text-center py-16 text-neutral-500 text-sm">
      Unable to load the menu right now. Please call us or visit in person.
    </div>

    <div *ngIf="!loading && !error" class="space-y-12">
      <div *ngFor="let item of menuItems" class="group border-b border-white/5 pb-10 last:border-0 last:pb-0">
        <div class="flex items-baseline justify-between mb-3">
          <h3 class="font-['Forum'] text-xl md:text-2xl text-white tracking-tight group-hover:text-[#C65A1E] transition-colors duration-300">
            {{ item.name }}
          </h3>
          <div class="flex-grow border-b border-white/10 border-dotted mx-4 relative top-[-6px]"></div>
          <span class="font-['Forum'] text-xl text-white shrink-0">{{ item.price }}</span>
        </div>
        <p class="text-sm text-neutral-400 font-light leading-relaxed pr-8">{{ item.description }}</p>
        <div *ngIf="item.isVegetarian || item.isVegan" class="mt-2 flex gap-2">
          <span *ngIf="item.isVegan" class="text-[10px] tracking-widest uppercase text-[#C65A1E] font-medium">Vegan</span>
          <span *ngIf="item.isVegetarian && !item.isVegan" class="text-[10px] tracking-widest uppercase text-emerald-400 font-medium">Vegetarian</span>
        </div>
      </div>
    </div>

    <div class="mt-20 text-center">
      <a href="#" class="inline-flex items-center justify-center px-10 py-4 text-sm font-medium text-white border border-white/20 rounded-xl hover:bg-white hover:text-[#0a0a0a] transition-all duration-300">
        View Full Menu
      </a>
    </div>
  </div>
</section>
